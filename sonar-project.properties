# Analisis estatico con SonarQube Cloud (paquete 1.2, Plan de Seguridad §10).
# La organizacion y la clave del proyecto llegan desde variables del repositorio
# (SONAR_ORGANIZATION, SONAR_PROJECT_KEY) y el token desde el secreto SONAR_TOKEN.
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=src/**/*.spec.ts,test/**/*.ts
sonar.exclusions=src/database/migrations/**,**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
