# Pipeline unico del backend de MeritIA (paquete 1.2 de la EDT, Plan de Seguridad §10).
#
# Criterios de aceptacion:
#   1. La construccion falla ante un secreto detectado, una vulnerabilidad
#      critica de dependencias o una prueba en rojo.
#   2. Los secretos no se comparten entre ambientes.
#   3. Un commit en la rama principal produce un artefacto desplegable sin
#      intervencion manual.
#
# Seguridad del propio pipeline:
#   - Todas las acciones van fijadas por SHA, no por etiqueta: una etiqueta se
#     puede mover a un commit malicioso, un SHA no. Dependabot los mantiene.
#   - Permisos minimos por defecto (solo lectura); cada trabajo pide lo que usa.
#   - checkout sin credenciales persistidas: ningun paso posterior hereda el token.
#   - Las pruebas corren con secretos efimeros generados en la propia ejecucion.

name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # En main no se cancela: cada commit de la rama principal debe dejar su artefacto.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GITLEAKS_VERSION: v8.30.1

jobs:
  secretos:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Todo el historial: un secreto borrado en un commit posterior sigue
          # filtrado para quien clone el repositorio.
          fetch-depth: 0
          persist-credentials: false

      - name: Escanear todo el historial
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "zricethezav/gitleaks:${GITLEAKS_VERSION}" \
            git /repo --redact --no-banner --verbose --exit-code 1

  dependencias:
    name: Dependencias (npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Lee el package-lock.json contra la base de avisos de npm. Falla con
      # cualquier vulnerabilidad critica; las altas y menores quedan en el
      # registro y las propone Dependabot.
      - name: Auditar dependencias
        run: npm audit --audit-level=critical

  calidad:
    name: Lint, build y OpenAPI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      # El contrato publicado tiene que corresponder al codigo (paquete 5.2).
      - name: OpenAPI al dia
        run: node scripts/exportar-openapi.mjs --check

  pruebas:
    name: Pruebas y cobertura
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Crear .env con secretos efimeros
        run: node scripts/preparar-env-ci.mjs

      # Las mismas imagenes y versiones que el entorno local (compose.yaml):
      # lo que pasa aqui es lo que pasa en la maquina de cada integrante.
      - name: Levantar PostgreSQL, Redis y el almacenamiento
        run: docker compose up -d --wait postgres redis almacenamiento

      # Unitarias e integracion en una sola corrida, con el umbral de cobertura
      # del Diccionario de la EDT: por debajo, falla.
      - name: Suite completa
        run: npm run test:total

      - name: Registros de los servicios
        if: failure()
        run: docker compose logs --no-color postgres redis almacenamiento

      - name: Guardar cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  analisis-estatico:
    name: Analisis estatico (SonarQube Cloud)
    needs: pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Aviso si SonarQube no esta configurado
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::warning::SonarQube Cloud sin configurar: falta el secreto SONAR_TOKEN y las variables SONAR_ORGANIZATION y SONAR_PROJECT_KEY. Ver docs/ci-cd.md."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_TOKEN != ''
        with:
          # Sonar usa el historial para atribuir los hallazgos al codigo nuevo.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.SONAR_TOKEN != ''
        with:
          name: cobertura
          path: coverage/

      - name: Analizar
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true

  imagen:
    name: Artefacto (imagen en GHCR)
    needs: [secretos, dependencias, calidad, pruebas]
    # Solo un commit en main produce artefacto. Los PR y las ramas se verifican
    # pero no publican nada.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      imagen: ${{ steps.referencia.outputs.imagen }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadatos
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # El SHA identifica exactamente que codigo se despliega; `main` sigue
          # a la ultima version verificada.
          tags: |
            type=sha,format=long
            type=raw,value=main

      - name: Construir y publicar
        id: construccion
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.metadatos.outputs.tags }}
          labels: ${{ steps.metadatos.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Se despliega por digest, no por etiqueta: la etiqueta puede cambiar
      # entre este paso y el despliegue, el digest no.
      - id: referencia
        run: |
          imagen="ghcr.io/${GITHUB_REPOSITORY,,}@${{ steps.construccion.outputs.digest }}"
          echo "imagen=$imagen" >> "$GITHUB_OUTPUT"
          echo "Artefacto: $imagen" >> "$GITHUB_STEP_SUMMARY"

  # Despliegue por ambientes. Cada uno es un Environment de GitHub con SUS
  # secretos: el trabajo de un ambiente no puede leer los de otro.
  # Desactivado hasta elegir proveedor de nube (variable DESPLIEGUE_HABILITADO).
  desplegar-desarrollo:
    needs: imagen
    if: vars.DESPLIEGUE_HABILITADO == 'true'
    uses: ./.github/workflows/desplegar.yml
    with:
      ambiente: desarrollo
      imagen: ${{ needs.imagen.outputs.imagen }}

  desplegar-pruebas:
    needs: [imagen, desplegar-desarrollo]
    if: vars.DESPLIEGUE_HABILITADO == 'true'
    uses: ./.github/workflows/desplegar.yml
    with:
      ambiente: pruebas
      imagen: ${{ needs.imagen.outputs.imagen }}

  desplegar-produccion:
    needs: [imagen, desplegar-pruebas]
    if: vars.DESPLIEGUE_HABILITADO == 'true'
    uses: ./.github/workflows/desplegar.yml
    with:
      ambiente: produccion
      imagen: ${{ needs.imagen.outputs.imagen }}
