# Entorno local completo de MeritIA: `docker compose up` y nada mas.
# Servicios separados, como pide el planteamiento de arquitectura: el monolito
# no lleva dentro ni la base de datos, ni la cola, ni el almacenamiento.

name: meritia

services:
  backend:
    build:
      context: .
      target: dev
    env_file:
      # Opcional para que `docker compose config` funcione en un clon recien
      # hecho; las variables sin valor por defecto fallan abajo con su mensaje.
      - path: .env
        required: false
    environment:
      # Dentro de la red de compose se habla por los puertos internos, no por
      # los publicados en el host.
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://almacenamiento:8333
      # El servicio de IA corre en su propio proyecto de compose, con su propia
      # red: desde aqui no se alcanza por "localhost", que seria este mismo
      # contenedor. En local se llega por el host; en produccion, por el nombre
      # del servicio en la red donde se despliegue.
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://host.docker.internal:13100}
      # Sin valor por omision y NO obligatoria. Dos razones:
      #
      # 1. La aplicacion ya trata el servicio de IA como opcional: sin clave
      #    entra el evaluador honesto del paquete 4.4, que falla con un motivo
      #    claro en vez de inventar una nota, y el health check lo reporta como
      #    "sin_configurar" sin tumbar el backend. Exigirla aqui contradecia su
      #    propio diseno.
      # 2. Con `:?`, docker compose interpola el archivo entero en CUALQUIER
      #    comando: `compose up postgres` moria pidiendo una clave de IA que no
      #    tiene nada que ver. Es lo que tenia la CI en rojo.
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-}
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      # El codigo se monta para recarga en caliente; node_modules queda en el
      # contenedor para no mezclar binarios nativos de Windows con los de Linux.
      - ./src:/app/src
      - ./test:/app/test
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
      - ./nest-cli.json:/app/nest-cli.json
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      almacenamiento:
        condition: service_healthy
    restart: unless-stopped

  # Informacion estructurada. Un solo cluster, un esquema por modulo.
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-meritia}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?definelo en .env}
      POSTGRES_DB: ${DATABASE_NAME:-meritia}
    ports:
      # Puertos propios de MeritIA en el host (1xxxx), no los de uso comun ni
      # los del rango dinamico.
      #
      # - No 5432: una instalacion nativa de PostgreSQL se queda con el y las
      #   conexiones del host acaban en ella con un error de contrasena que no
      #   apunta a la causa. El 5433 tampoco: es el alternativo clasico.
      # - No 49152-65535: es el rango dinamico de Windows, del que Hyper-V
      #   reserva bloques distintos EN CADA REINICIO. Un puerto de ahi funciona
      #   hoy y falla manana con "acceso a un socket no permitido". Paso con
      #   el 16379 de Redis tras reiniciar el equipo.
      - '${DATABASE_PORT:-15432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-meritia} -d ${DATABASE_NAME:-meritia}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Doble funcion: cola de trabajos para la evaluacion con IA (asincrona, para
  # que la peticion del candidato no espere al modelo) y respaldo del rate
  # limiting en tres capas del Plan de Seguridad.
  redis:
    image: redis:8.2-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-16379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Almacenamiento de objetos compatible con S3, para entregas de candidatos y
  # evidencias. Los binarios no van a PostgreSQL.
  # Almacenamiento de objetos compatible con S3.
  #
  # ESTO ERA MinIO, Y DEJO DE PODER SER
  #
  # MinIO borro minio/minio y minio/mc de Docker Hub el 11 de septiembre de
  # 2026. Su documentacion remite a quay.io, pero ahi la imagen exige cuenta:
  # devuelve 401 incluso pidiendo un token anonimo. En una maquina con la
  # imagen en cache todo seguia funcionando, asi que el problema solo se vio
  # cuando se miro la CI: ahi no hay cache y el paso de levantar servicios no
  # podia descargarla.
  #
  # SE MIDIERON LOS SUSTITUTOS CONTRA LAS 14 PRUEBAS DE ALMACENAMIENTO
  #
  #   - adobe/s3mock: descartado sin llegar a probarlo. No valida firmas, asi
  #     que volveria verde y mentirosa la prueba de que un enlace prefirmado
  #     alterado no sirve.
  #   - localstack/localstack:4: 11 de 14. Sirve objetos SIN firma —200 donde
  #     tiene que dar 403— y da el bucket por publico. Valida firmas, pero no
  #     deniega el acceso anonimo, que es medio criterio del paquete 3.3.
  #   - zenko/cloudserver: 14 de 14 y las 184 de integracion, pero su imagen
  #     se actualizo por ultima vez el 22/04/2022 y sus tags de version son de
  #     2022 y 2023. Para un proyecto con plan de seguridad, no.
  #   - chrislusf/seaweedfs:4.48: 14 de 14 y las 184 de integracion. Release
  #     del 28/09/2026, mantenido, y con version que se puede fijar. Es este.
  #
  # Produccion no cambia: la aplicacion habla S3 por el SDK de AWS, asi que
  # alla puede seguir MinIO con licencia o S3 de verdad. Lo que cambia es el
  # contenedor de desarrollo y de CI. Queda como divergencia con el Blueprint
  # tecnico, anotada en docs/arquitectura.md §10.
  almacenamiento:
    image: chrislusf/seaweedfs:4.48
    # Las credenciales se escriben al arrancar desde las mismas variables que
    # ya usa la aplicacion. SeaweedFS las pide en un archivo de configuracion,
    # y un archivo con credenciales no se versiona: se arma aqui en /tmp.
    entrypoint:
      - sh
      - -c
      - >
        printf '{"identities":[{"name":"meritia","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data -ip=0.0.0.0
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-meritia}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?definelo en .env}
    ports:
      # El puerto publicado no cambia: ningun .env del equipo necesita tocarse.
      - '${S3_PORT:-19000}:8333'
    volumes:
      - almacenamiento-data:/data
    healthcheck:
      # Un 403 sin firmar es la respuesta correcta, y comprueba las dos cosas
      # de una vez: que el S3 escucha y que exige credenciales. Un 200 aqui
      # seria una alarma, no una señal de salud.
      test:
        - CMD-SHELL
        - test "$$(curl -s -o /dev/null -w %{http_code} --max-time 3 http://localhost:8333/)" = 403
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  almacenamiento-data:
